name: Daily 4-Hour Audio Stream Grabber

on:
  schedule:
    # Triggers at 1:00 PM UTC (6:00 AM PDT during Summer)
    - cron: '0 13 * * *'
    # Triggers at 2:00 PM UTC (6:00 AM PST during Winter)
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  capture-and-transfer:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Installs ffmpeg in case your stream script uses it to capture AAC
        sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Run Script for 4 Hours
      run: |
        chmod +x script.sh
        # Runs your script to record from 6 AM to 10 AM
        ./liveklos.sh 

